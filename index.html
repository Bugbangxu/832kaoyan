<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>832 上岸计划 · 每日打卡</title>
<style>
:root{
  --bg:#ffffff;
  --fg:#1b1b1b;
  --fg2:#7a7a7a;
  --line:#e6e6e6;
  --line2:#cfcfcf;
  --soft:#f5f5f5;
  --acc:hsl(0 62% 44%);        /* 当日主题色，由 JS 注入 */
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','SimHei','Heiti SC','Noto Sans SC',sans-serif;
  font-weight:700;
  background:var(--bg);
  color:var(--fg);
  line-height:1.7;
  font-size:15.5px;
  padding-bottom:80px;
}
::selection{background:var(--acc);color:#fff}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  border-bottom:2px solid var(--fg);
}
.topbar-in{
  max-width:1180px;margin:0 auto;padding:13px 22px 11px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{font-size:20px;letter-spacing:.04em;font-weight:900}
.brand .seal{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;background:var(--acc);color:#fff;
  font-size:14px;font-weight:900;margin-right:10px;letter-spacing:0;
  vertical-align:-7px;transition:background .35s;
}
.top-meta{color:var(--fg2);font-size:12.5px;letter-spacing:.06em}
.top-meta b{color:var(--acc);font-size:15px;font-weight:900;transition:color .35s}
.top-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{
  font-family:inherit;font-weight:700;font-size:12.5px;letter-spacing:.08em;
  padding:7px 15px;background:transparent;color:var(--fg);
  border:1.5px solid var(--line2);cursor:pointer;
  transition:border-color .25s,color .25s,background .25s;
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.solid{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.solid:hover{filter:brightness(.9);color:#fff}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- layout ---------- */
.layout{
  max-width:1180px;margin:0 auto;padding:26px 22px 40px;
  display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:38px;align-items:start;
}
@media(max-width:920px){.layout{grid-template-columns:1fr;gap:26px}}

/* ---------- view tabs ---------- */
.viewtabs{display:flex;gap:26px;border-bottom:2px solid var(--fg);margin-bottom:22px}
.tab{
  font-family:inherit;font-weight:900;background:none;border:none;cursor:pointer;
  font-size:15px;letter-spacing:.12em;color:var(--fg2);
  padding:8px 2px 10px;position:relative;
}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--acc);transition:color .35s}
.tab.on::after{
  content:'';position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--acc);
  transition:background .35s;
}

/* ---------- day header ---------- */
.day-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.day-date{font-size:clamp(34px,5vw,52px);line-height:1.1;font-weight:900;letter-spacing:.02em}
.day-date .yr{font-size:.38em;color:var(--fg2);letter-spacing:.12em;font-weight:700;margin-right:8px}
.day-wd{font-size:16px;color:var(--fg2);letter-spacing:.2em;padding-bottom:8px}
.chip{
  display:inline-block;font-size:12px;letter-spacing:.14em;font-weight:900;
  background:var(--acc);color:#fff;padding:3px 12px;margin-bottom:9px;
  transition:background .35s;
}
.chip.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}

.datenav{display:flex;align-items:center;gap:8px;margin:14px 0 20px;flex-wrap:wrap}
.nav-arrow{
  font-family:inherit;font-weight:900;width:40px;height:36px;cursor:pointer;
  background:transparent;border:1.5px solid var(--line2);color:var(--fg);font-size:16px;
  transition:border-color .25s,color .25s;
}
.nav-arrow:hover{border-color:var(--acc);color:var(--acc)}
.nav-label{font-size:12.5px;letter-spacing:.1em;color:var(--fg2);min-width:150px;text-align:center}

.weekstrip{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 26px}
.ws-day{
  flex:1;min-width:74px;cursor:pointer;text-align:center;
  border:1.5px solid var(--line);border-bottom-width:3px;
  padding:7px 4px 9px;background:transparent;font-family:inherit;font-weight:700;
  transition:border-color .25s,background .25s,color .25s;
}
.ws-day:hover{border-color:var(--acc)}
.ws-day .wd{font-size:11px;letter-spacing:.16em;color:var(--fg2)}
.ws-day .dn{font-size:17px;font-weight:900;margin:1px 0 4px;transition:color .35s}
.ws-dot{width:8px;height:8px;background:var(--line2);display:inline-block;transition:background .3s}
.ws-day.part .ws-dot{background:color-mix(in srgb, var(--acc) 55%, #fff)}
.ws-day.full{background:var(--acc);border-color:var(--acc)}
.ws-day.full .wd,.ws-day.full .dn{color:#fff}
.ws-day.full .ws-dot{background:#fff}
.ws-day.today{border-color:var(--acc)}
.ws-day.today .dn{color:var(--acc)}
.ws-day.full.today .dn{color:#fff}

/* ---------- banners ---------- */
.banner{
  background:var(--soft);border-left:5px solid var(--acc);
  padding:12px 16px 12px 18px;margin:0 0 26px;font-size:14px;
  transition:border-color .35s;
}
.banner .lb{letter-spacing:.18em;color:var(--acc);font-size:11.5px;display:block;font-weight:900;transition:color .35s}

/* ---------- task blocks ---------- */
.block{margin:0 0 34px;opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.19,1,.22,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.block-head{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--fg);padding-bottom:5px;margin-bottom:4px}
.block-time{font-size:11.5px;letter-spacing:.18em;color:var(--fg2)}
.block-sub{font-size:14px;letter-spacing:.22em;font-weight:900;color:var(--acc);transition:color .35s}
.block-count{margin-left:auto;font-size:11.5px;letter-spacing:.1em;color:var(--fg2)}

.task{
  display:flex;gap:14px;align-items:flex-start;
  padding:12px 4px 11px;border-bottom:1px solid var(--line);
  cursor:pointer;-webkit-user-select:none;user-select:none;
}
.task:hover .cbx{border-color:var(--acc)}
.cbx{
  flex:none;width:23px;height:23px;margin-top:3px;
  border:2px solid var(--fg);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:background .25s,border-color .25s,transform .18s;
}
.cbx svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s ease-out}
.task.done .cbx{background:var(--acc);border-color:var(--acc)}
.task.done .cbx svg{stroke-dashoffset:0}
.task.done:active .cbx{transform:scale(.9)}
.tt{position:relative;font-size:15px;padding-right:6px;transition:color .3s}
.tt::after{
  content:'';position:absolute;left:-2px;top:53%;width:calc(100% + 4px);height:2px;
  background:var(--acc);transform:scaleX(0);transform-origin:left center;
  transition:transform .32s cubic-bezier(.19,1,.22,1),background .35s;
}
.task.done .tt{color:var(--fg2)}
.task.done .tt::after{transform:scaleX(1)}
.day-note{
  margin-top:28px;padding:12px 16px;background:var(--soft);
  font-size:13px;color:var(--fg2);border-left:5px solid var(--line2);
}
.day-note .lb{letter-spacing:.18em;font-size:11px;color:var(--fg2);display:block}

/* ---------- week view ---------- */
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:20px}
.wg-day{opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.19,1,.22,1) forwards}
.wg-head{border-bottom:2px solid var(--acc);padding-bottom:4px;margin-bottom:8px;display:flex;align-items:baseline;gap:9px}
.wg-head .dn{font-weight:900;font-size:15px}
.wg-head .dt{font-size:11.5px;color:var(--fg2);letter-spacing:.06em}
.wg-task{display:flex;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}
.wg-task .cbx{width:18px;height:18px;margin-top:4px;border-width:1.5px}
.wg-task .cbx svg{width:12px;height:12px}
.wg-task .tt{font-size:13px;line-height:1.6}
.wg-task .blk{font-size:9.5px;letter-spacing:.14em;color:var(--fg2);display:block}

/* ---------- all-weeks view ---------- */
.phase-head{
  display:flex;align-items:baseline;gap:14px;margin:30px 0 10px;
  border-bottom:2px solid var(--fg);padding-bottom:4px;
}
.phase-head:first-child{margin-top:4px}
.phase-name{font-size:15px;font-weight:900;letter-spacing:.2em}
.phase-range{font-size:11.5px;color:var(--fg2);letter-spacing:.08em}
.phase-goal{font-size:12px;color:var(--fg2);margin:0 0 12px;letter-spacing:.02em;font-weight:600}
.wk-row{
  display:grid;grid-template-columns:56px 118px 1fr 58px;gap:14px;align-items:center;
  padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;
  transition:background .25s;
}
.wk-row:hover{background:var(--soft)}
.wk-no{font-weight:900;letter-spacing:.06em;transition:color .25s}
.wk-row:hover .wk-no{color:var(--acc)}
.wk-rg{font-size:12px;color:var(--fg2);letter-spacing:.04em}
.wk-bar{height:10px;background:var(--soft);position:relative;overflow:hidden}
.wk-bar i{position:absolute;inset:0;width:0;background:var(--acc);transition:width .5s cubic-bezier(.19,1,.22,1)}
.wk-pct{font-size:12px;color:var(--fg2);text-align:right;letter-spacing:.04em}
.wk-row.cur{background:var(--soft);border-left:5px solid var(--acc);padding-left:10px}
.wk-row.cur .wk-no{color:var(--acc)}

/* ---------- milestones ---------- */
.ms-list{border-top:2px solid var(--fg)}
.ms-row{
  display:grid;grid-template-columns:110px 1fr 220px;gap:16px;
  padding:13px 6px;border-bottom:1px solid var(--line);align-items:baseline;
}
.ms-when{font-size:12.5px;letter-spacing:.1em;color:var(--acc);font-weight:900}
.ms-what{font-size:14px}
.ms-goal{font-size:12.5px;color:var(--fg2)}
@media(max-width:720px){.ms-row{grid-template-columns:1fr;gap:2px}}
.w00-list .task{padding:10px 4px}

/* ---------- sidebar ---------- */
.side{position:sticky;top:86px;display:flex;flex-direction:column;gap:20px}
@media(max-width:920px){.side{position:static}}
.side-card{background:var(--bg);border:1.5px solid var(--line2);padding:18px}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--acc);stroke-linecap:butt;transition:stroke-dashoffset .7s cubic-bezier(.19,1,.22,1),stroke .35s}
.ring-num{font-size:22px;font-weight:900;letter-spacing:.01em}
.ring-lb{font-size:11px;letter-spacing:.18em;color:var(--fg2)}
.countdown{margin-top:14px;padding-top:12px;border-top:2px solid var(--fg);display:flex;align-items:baseline;gap:10px}
.countdown .big{font-size:34px;font-weight:900;color:var(--acc);line-height:1;transition:color .35s}
.countdown .lb{font-size:11px;letter-spacing:.2em;color:var(--fg2)}
.side-title{font-size:11px;letter-spacing:.26em;color:var(--fg2);margin-bottom:10px;display:block;font-weight:900}
.phase-now{font-size:17px;font-weight:900;letter-spacing:.16em;margin-bottom:4px;color:var(--acc);transition:color .35s}
.phase-now-sub{font-size:12px;color:var(--fg2);margin-bottom:8px}
.phase-now-goal{font-size:12.5px;line-height:1.75;font-weight:600}
.data-btns{display:flex;flex-direction:column;gap:8px}
.data-btns .btn{width:100%}
.tiny{font-size:11px;color:var(--fg2);letter-spacing:.03em;line-height:1.75;font-weight:600}

/* ---------- empty ---------- */
.empty{padding:60px 10px;text-align:center;color:var(--fg2);font-weight:600}
.empty .big{font-size:22px;color:var(--fg);letter-spacing:.18em;margin-bottom:10px;display:block;font-weight:900}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}

/* ---------- date helpers ---------- */
function parseD(s){ return new Date(s + 'T00:00:00'); }
const START = parseD(DATA.meta.start);          // W01 Monday 2026-11-02
const EXAM  = parseD(DATA.meta.exam);
const W00_START = parseD('2026-10-29');
function addDays(d,n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function dayDiff(a,b){ return Math.round((a.getTime()-b.getTime())/86400000); }
function fmtMD(d){ return (d.getMonth()+1) + '.' + String(d.getDate()).padStart(2,'0'); }
function fmtFull(d){ return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0'); }
function wdIdx(d){ return (d.getDay()+6)%7; }   // Mon=0
function weekStart(n){ return addDays(START,(n-1)*7); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- daily color: golden-angle hue rotation ---------- */
function hueOf(d){
  const idx = Math.round((d.getTime()-START.getTime())/86400000);
  return ((idx*137.508)%360+360)%360;
}
function hueMain(h){ return 'hsl('+h.toFixed(1)+' 64% 44%)'; }

function locate(d){
  const diff = dayDiff(d, START);
  if(diff < 0){
    if(dayDiff(d, W00_START) >= 0) return { kind:'w00' };
    return { kind:'pre' };
  }
  if(diff >= DATA.weeks.length*7) return { kind:'post' };
  return { kind:'week', week: Math.floor(diff/7)+1, dayIdx: diff%7 };
}

function isChecked(k){ return !!store[k]; }
function toggle(k){ if(store[k]) delete store[k]; else store[k] = 1; save(); }

function dayTasks(week, dayIdx){
  const w = DATA.weeks[week-1];
  const day = w && w.days[DAYNAMES[dayIdx]];
  return day ? day.tasks : [];
}
function dayStats(week, dayIdx){
  const ts = dayTasks(week, dayIdx);
  let done = 0;
  ts.forEach((t,i)=>{ if(isChecked(tKey(week,dayIdx,i))) done++; });
  return { done, total: ts.length };
}
const TOTAL_TASKS = DATA.weeks.reduce((s,w)=>s+Object.values(w.days).reduce((a,d)=>a+d.tasks.length,0),0) + DATA.meta.w00.length;
function totalDone(){
  let n = 0;
  DATA.meta.w00.forEach((t,i)=>{ if(isChecked(w00Key(i))) n++; });
  DATA.weeks.forEach(w=>{
    Object.keys(w.days).forEach(dn=>{
      const idx = DAYNAMES.indexOf(dn);
      w.days[dn].tasks.forEach((t,i)=>{ if(isChecked(tKey(w.num,idx,i))) n++; });
    });
  });
  return n;
}

/* ---------- app state ---------- */
let view = 'today';
let viewDate = new Date();
viewDate.setHours(0,0,0,0);

function setViewDate(d){ viewDate = d; render(); }

/* ---------- renderers ---------- */
function phaseOf(week){
  return DATA.meta.phases.find(p => week >= p.from && week <= p.to) || DATA.meta.phases[DATA.meta.phases.length-1];
}

function taskRow(key, text, small){
  const done = isChecked(key);
  return '<div class="'+(small?'wg-task':'task')+(done?' done':'')+'" data-key="'+key+'" role="checkbox" aria-checked="'+done+'" tabindex="0">'+
    '<button class="cbx" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7.5"/></svg></button>'+
    '<span class="tt">'+esc(text)+'</span></div>';
}

function weekStrip(week, dayIdx, base){
  return '<div class="weekstrip">' + DAYNAMES.map((dn,i)=>{
    const d = addDays(weekStart(week), i);
    const st = dayStats(week, i);
    const cls = st.total>0 && st.done===st.total ? 'full' : (st.done>0 ? 'part' : '');
    const isToday = isSameDay(d, new Date());
    return '<button class="ws-day '+cls+(isToday?' today':'')+'" style="--acc:'+hueMain(hueOf(d))+'" data-jump="'+fmtFull(d)+'">'+
      '<div class="wd">'+dn+'</div><div class="dn">'+fmtMD(d)+'</div><span class="ws-dot"></span></button>';
  }).join('') + '</div>';
}

function renderToday(){
  const d = viewDate;
  const loc = locate(d);
  const root = document.getElementById('viewRoot');

  if(loc.kind === 'pre'){
    root.innerHTML = '<div class="empty"><span class="big">还没开跑</span>计划 2026.11.02（周一）正式启动。<br>启动周 10.29-11.1 的准备清单在「里程碑」页。'+
      '<div style="margin-top:22px"><button class="btn" data-jump="2026-11-02">跳到第一天</button></div></div>';
    return;
  }
  if(loc.kind === 'post'){
    root.innerHTML = '<div class="empty"><span class="big">初试已结束</span>410，等你的好消息。</div>';
    return;
  }

  let html = '<div class="day-head"><div class="day-date"><span class="yr">'+d.getFullYear()+'</span>'+
    String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'</div>'+
    '<div class="day-wd">'+DAYNAMES[wdIdx(d)]+'</div>';

  if(loc.kind === 'week'){
    const ph = phaseOf(loc.week);
    html += '<div class="chip">'+ph.name+' · W'+String(loc.week).padStart(2,'0')+'</div>';
    html += '<div class="chip ghost">'+(wdIdx(d)+1)+' / 7</div>';
  }else{
    html += '<div class="chip">启动周 W00</div>';
  }
  html += '</div>';

  html += '<div class="datenav">'+
    '<button class="nav-arrow" id="prevDay">‹</button>'+
    '<span class="nav-label">'+fmtFull(addDays(d,-1))+' — '+fmtFull(addDays(d,1))+'</span>'+
    '<button class="nav-arrow" id="nextDay">›</button>'+
    '<button class="btn" data-jump="'+fmtFull(new Date())+'">今天</button>'+
    '</div>';

  if(loc.kind === 'week'){
    const w = DATA.weeks[loc.week-1];
    html += weekStrip(loc.week, loc.dayIdx);
    if(w.note){
      html += '<div class="banner"><span class="lb">本周备注</span>'+esc(w.note)+'</div>';
    }
    const day = w.days[DAYNAMES[loc.dayIdx]] || {tasks:[],note:''};
    let delay = 0;
    BLOCK_ORDER.forEach(bk=>{
      const items = day.tasks.map((t,i)=>({t,i})).filter(x=>x.t.block===bk);
      if(!items.length) return;
      const b = BLOCKS[bk];
      const doneN = items.filter(x=>isChecked(tKey(loc.week,loc.dayIdx,x.i))).length;
      html += '<section class="block" style="animation-delay:'+(delay*70)+'ms">'+
        '<div class="block-head"><span class="block-time">'+b.time+'</span>'+
        '<span class="block-sub">'+b.subject+'</span>'+
        '<span class="block-count">'+doneN+' / '+items.length+'</span></div>'+
        items.map(x=>taskRow(tKey(loc.week,loc.dayIdx,x.i), x.t.text)).join('')+
        '</section>';
      delay++;
    });
    if(!day.tasks.length){
      html += '<div class="empty"><span class="big">今天没有排课</span>机动日：补漏 + 休息。</div>';
    }
    if(day.note){
      html += '<div class="day-note"><span class="lb">备注 / 复盘</span>'+esc(day.note)+'</div>';
    }
  }else{
    // W00
    html += '<div class="banner"><span class="lb">启动周 10.29 - 11.1</span>开跑前的准备，做完一项勾一项。</div>';
    html += '<section class="block w00-list"><div class="block-head"><span class="block-time">准备清单</span>'+
      '<span class="block-sub">W00</span></div>'+
      DATA.meta.w00.map((t,i)=>taskRow(w00Key(i), t)).join('')+'</section>';
  }
  root.innerHTML = html;

  const prev = document.getElementById('prevDay');
  const next = document.getElementById('nextDay');
  if(prev) prev.addEventListener('click', ()=>setViewDate(addDays(viewDate,-1)));
  if(next) next.addEventListener('click', ()=>setViewDate(addDays(viewDate,1)));
}

function renderWeek(){
  const d = viewDate;
  const loc = locate(d);
  const root = document.getElementById('viewRoot');
  if(loc.kind !== 'week'){
    root.innerHTML = '<div class="empty"><span class="big">'+(loc.kind==='w00'?'启动周':'未排期')+'</span>'+
      (loc.kind==='w00'?'在「今日」视图查看准备清单。':'本周视图从 2026.11.02 开始。')+'</div>';
    return;
  }
  const w = DATA.weeks[loc.week-1];
  const ws = weekStart(loc.week);
  let html = '<div class="day-head"><div class="day-date"><span class="yr">W'+String(loc.week).padStart(2,'0')+'</span>'+
    fmtMD(ws)+' — '+fmtMD(addDays(ws,6))+'</div>'+
    '<div class="chip">'+phaseOf(loc.week).name+'</div></div>';
  html += '<div class="datenav">'+
    '<button class="nav-arrow" id="prevDay">‹</button>'+
    '<span class="nav-label">第 '+loc.week+' 周 / 共 60 周</span>'+
    '<button class="nav-arrow" id="nextDay">›</button>'+
    '<button class="btn" data-jump="'+fmtFull(new Date())+'">今天</button>'+
    '</div>';
  if(w.note) html += '<div class="banner"><span class="lb">本周备注</span>'+esc(w.note)+'</div>';

  html += '<div class="weekgrid">' + DAYNAMES.map((dn,i)=>{
    const day = w.days[dn] || {tasks:[],note:''};
    const dd = addDays(ws,i);
    const isToday = isSameDay(dd,new Date());
    return '<div class="wg-day" style="animation-delay:'+(i*60)+'ms;--acc:'+hueMain(hueOf(dd))+'">'+
      '<div class="wg-head'+(isToday?' today':'')+'"><span class="dn">'+dn+'</span><span class="dt">'+fmtMD(dd)+'</span></div>'+
      (day.tasks.length
        ? day.tasks.map((t,j)=>{
            const done = isChecked(tKey(loc.week,i,j));
            return '<div class="wg-task'+(done?' done':'')+'" data-key="'+tKey(loc.week,i,j)+'" role="checkbox" aria-checked="'+done+'" tabindex="0">'+
              '<button class="cbx" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7.5"/></svg></button>'+
              '<span><span class="blk">'+BLOCKS[t.block].subject+'</span><span class="tt">'+esc(t.text)+'</span></span></div>';
          }).join('')
        : '<div class="tiny">—</div>')+
      '</div>';
  }).join('') + '</div>';

  root.innerHTML = html;
  document.getElementById('prevDay').addEventListener('click', ()=>setViewDate(addDays(viewDate,-7)));
  document.getElementById('nextDay').addEventListener('click', ()=>setViewDate(addDays(viewDate,7)));
}

function renderAll(){
  const loc = locate(new Date());
  const curWeek = loc.kind==='week' ? loc.week : (loc.kind==='w00' ? 1 : 0);
  let html = '';
  DATA.meta.phases.forEach(p=>{
    html += '<div class="phase-head"><span class="phase-name">'+p.name+'</span>'+
      '<span class="phase-range">'+p.range+' · W'+String(p.from).padStart(2,'0')+'-W'+String(p.to).padStart(2,'0')+'</span></div>'+
      '<div class="phase-goal">'+esc(p.goal)+'</div>';
    for(let n=p.from; n<=p.to; n++){
      const w = DATA.weeks[n-1];
      if(!w) continue;
      const ws = weekStart(n);
      let done=0,total=0;
      DAYNAMES.forEach((dn,i)=>{
        const st = dayStats(n,i);
        done+=st.done; total+=st.total;
      });
      const pct = total? Math.round(done/total*100):0;
      html += '<div class="wk-row'+(n===curWeek?' cur':'')+'" style="--acc:'+hueMain(hueOf(ws))+'" data-week="'+n+'">'+
        '<span class="wk-no">W'+String(n).padStart(2,'0')+'</span>'+
        '<span class="wk-rg">'+fmtMD(ws)+' — '+fmtMD(addDays(ws,6))+'</span>'+
        '<span class="wk-bar"><i style="width:'+pct+'%"></i></span>'+
        '<span class="wk-pct">'+pct+'%</span></div>';
    }
  });
  document.getElementById('viewRoot').innerHTML = html;
}

function renderMilestones(){
  let html = '<div class="day-head"><div class="day-date">里程碑 & 检验点</div></div>';
  html += '<div class="ms-list">' + DATA.meta.milestones.map(m=>{
    return '<div class="ms-row"><span class="ms-when">'+esc(m[0])+'</span>'+
      '<span class="ms-what">'+esc(m[1]||'')+'</span>'+
      '<span class="ms-goal">'+esc(m[2]||'')+'</span></div>';
  }).join('') + '</div>';
  html += '<div class="phase-head" style="margin-top:34px"><span class="phase-name">启动周 W00</span>'+
    '<span class="phase-range">2026.10.29 - 11.01</span></div>'+
    '<section class="block w00-list">'+DATA.meta.w00.map((t,i)=>taskRow(w00Key(i), t)).join('')+'</section>';
  document.getElementById('viewRoot').innerHTML = html;
}

/* ---------- sidebar ---------- */
function renderSide(){
  const done = totalDone();
  const pct = TOTAL_TASKS ? done/TOTAL_TASKS : 0;
  const C = 2*Math.PI*43;
  document.getElementById('ringFg').setAttribute('stroke-dashoffset', String(C*(1-pct)));
  document.getElementById('ringNum').textContent = Math.round(pct*100) + '%';
  document.getElementById('ringCnt').textContent = done + ' / ' + TOTAL_TASKS + ' 任务';

  const today = new Date(); today.setHours(0,0,0,0);
  const cd = dayDiff(EXAM, today);
  document.getElementById('cdNum').textContent = cd > 0 ? cd : '0';

  const loc = locate(today);
  const ph = loc.kind==='week' ? phaseOf(loc.week) : (loc.kind==='w00' ? DATA.meta.phases[0] : null);
  if(ph){
    document.getElementById('phaseName').textContent = ph.name;
    document.getElementById('phaseRange').textContent = ph.range;
    document.getElementById('phaseGoal').textContent = ph.goal;
  }else{
    document.getElementById('phaseName').textContent = '未开始 / 已结束';
    document.getElementById('phaseRange').textContent = '';
    document.getElementById('phaseGoal').textContent = '';
  }
}

/* ---------- main render ---------- */
function render(){
  document.documentElement.style.setProperty('--acc', hueMain(hueOf(viewDate)));
  if(view==='today') renderToday();
  else if(view==='week') renderWeek();
  else if(view==='all') renderAll();
  else renderMilestones();
  renderSide();
}

/* ---------- events ---------- */
document.getElementById('tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(!t) return;
  view = t.dataset.view;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
  render();
});

document.body.addEventListener('click', e=>{
  const jump = e.target.closest('[data-jump]');
  if(jump){
    const parts = jump.dataset.jump.split('-');
    setViewDate(new Date(+parts[0], +parts[1]-1, +parts[2]));
    return;
  }
  const wk = e.target.closest('[data-week]');
  if(wk){
    setViewDate(weekStart(+wk.dataset.week));
    view = 'week';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.view==='week'));
    render();
    return;
  }
  const task = e.target.closest('.task,.wg-task');
  if(task && task.dataset.key){
    toggle(task.dataset.key);
    const done = isChecked(task.dataset.key);
    task.classList.toggle('done', done);
    task.setAttribute('aria-checked', String(done));
    renderSide();
    if(view==='today'){
      const loc = locate(viewDate);
      if(loc.kind==='week'){
        const strips = document.querySelector('.weekstrip');
        if(strips){ strips.outerHTML = weekStrip(loc.week, loc.dayIdx); }
        document.querySelectorAll('.block').forEach(sec=>{
          const rows = sec.querySelectorAll('.task');
          const cnt = sec.querySelector('.block-count');
          if(cnt && rows.length){
            let dn = 0;
            rows.forEach(r=>{ if(r.classList.contains('done')) dn++; });
            cnt.textContent = dn + ' / ' + rows.length;
          }
        });
      }
    }
    return;
  }
});

document.body.addEventListener('keydown', e=>{
  if(e.key===' ' || e.key==='Enter'){
    const task = e.target.closest && e.target.closest('.task,.wg-task');
    if(task && task.dataset.key){
      e.preventDefault();
      task.click();
    }
  }
});

document.getElementById('btnToday').addEventListener('click', ()=>{
  setViewDate(new Date());
  if(view==='all'||view==='ms'){ view='today';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.view==='today'));
    render();
  }
});

document.getElementById('btnExport').addEventListener('click', ()=>{
  const payload = JSON.stringify({ app:'p832-check', v:1, exported:new Date().toISOString(), store }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([payload], {type:'application/json'}));
  a.download = '832-plan-progress.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('btnImport').addEventListener('click', ()=>{
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const obj = JSON.parse(r.result);
      store = Object.assign({}, store, obj.store || {});
      save(); render();
      alert('导入完成。');
    }catch(err){ alert('文件解析失败。'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

document.getElementById('btnReset').addEventListener('click', ()=>{
  if(confirm('确定清空全部打卡记录？建议先导出备份。')){
    store = {}; save(); render();
  }
});

render();
/*APP-END*/
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
